<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Little List — A calmer to-do list</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #f5f4f0;
      --card: #fffefa;
      --ink: #242a25;
      --muted: #858b83;
      --line: #e9e9e2;
      --accent: #52775d;
      --accent-soft: #e9f0e9;
      --focus: #7aa887;
      --shadow: 0 24px 70px rgb(34 44 35 / 7%), 0 2px 8px rgb(34 44 35 / 3%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171a17;
        --card: #202520;
        --ink: #edf0e9;
        --muted: #9aa397;
        --line: #343a34;
        --accent: #a5c5a9;
        --accent-soft: #2b392d;
        --focus: #b7d8bb;
        --shadow: 0 24px 70px rgb(0 0 0 / 25%), 0 2px 8px rgb(0 0 0 / 12%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 72px 22px 48px;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(223 231 218 / 55%), transparent 48%),
        var(--page);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
      transition: background-color 220ms ease, color 220ms ease;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(ellipse at 50% 0%, rgb(52 70 53 / 32%), transparent 48%),
          var(--page);
      }
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 25px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
    }

    .brand-mark {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 8px;
    }

    .brand-mark svg { width: 13px; height: 13px; }

    .date { letter-spacing: .08em; }

    .list-card {
      overflow: hidden;
      border: 1px solid rgb(128 138 123 / 12%);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: background-color 220ms ease, border-color 220ms ease;
    }

    .card-head { padding: 32px 32px 24px; }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 34px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-wrap { margin-top: 25px; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-label strong {
      color: var(--ink);
      font-weight: 600;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 9px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .task-list {
      margin: 0;
      padding: 0 32px;
      list-style: none;
    }

    .task {
      display: flex;
      min-height: 59px;
      align-items: center;
      gap: 13px;
      border-top: 1px solid var(--line);
      animation: arrive 260ms ease both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check-wrap {
      position: relative;
      display: grid;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      place-items: center;
    }

    .task-check {
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }

    .check-ui {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border: 1.5px solid #c8cec5;
      border-radius: 7px;
      color: transparent;
      transition: transform 180ms cubic-bezier(.2, .8, .2, 1), background 180ms ease, border-color 180ms ease, color 180ms ease;
      pointer-events: none;
    }

    .check-ui svg { width: 12px; height: 12px; transform: scale(.45); transition: transform 180ms cubic-bezier(.2, .8, .2, 1); }
    .task-check:hover + .check-ui { border-color: var(--accent); }
    .task-check:focus-visible + .check-ui { outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent); outline-offset: 3px; }
    .task-check:checked + .check-ui { transform: scale(1.05); border-color: var(--accent); background: var(--accent); color: var(--card); }
    .task-check:checked + .check-ui svg { transform: scale(1); }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      transition: color 200ms ease, opacity 200ms ease;
    }

    .task.is-complete .task-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

    .delete-task {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: background 160ms ease, color 160ms ease, opacity 160ms ease;
    }

    .task:hover .delete-task, .delete-task:focus-visible { opacity: 1; }
    .delete-task:hover { background: var(--accent-soft); color: var(--ink); }
    .delete-task svg { width: 16px; height: 16px; }

    .empty-state {
      display: none;
      padding: 27px 0 29px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    .empty-state.visible { display: block; }

    .add-area {
      display: flex;
      gap: 10px;
      padding: 23px 32px 27px;
      border-top: 1px solid var(--line);
    }

    .task-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background: var(--page);
      color: var(--ink);
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 220ms ease;
    }

    .task-input::placeholder { color: var(--muted); opacity: .8; }
    .task-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }

    .add-button {
      display: inline-flex;
      height: 44px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 15px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform 150ms ease, filter 150ms ease;
    }

    @media (prefers-color-scheme: dark) { .add-button { color: #1b261d; } }
    .add-button:hover { filter: brightness(1.06); }
    .add-button:active { transform: scale(.97); }
    .add-button:focus-visible, .delete-task:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent); outline-offset: 2px; }
    .add-button svg { width: 15px; height: 15px; }

    .storage-note {
      min-height: 20px;
      margin: 15px 4px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .storage-note.error { color: #b55046; }

    @media (max-width: 520px) {
      body { padding: 40px 16px 32px; }
      .card-head { padding: 27px 23px 21px; }
      .task-list { padding: 0 23px; }
      .add-area { padding: 20px 23px 23px; }
      .delete-task { opacity: .7; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Little List
      </div>
      <time class="date" id="today"></time>
    </div>

    <section class="list-card" aria-labelledby="page-title">
      <header class="card-head">
        <h1 id="page-title">A little progress<br>goes a long way.</h1>
        <p class="subtitle">Make space for what matters today.</p>
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="remaining-label">0 tasks left</span>
            <strong id="progress-label">0% done</strong>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </header>

      <ul class="task-list" id="task-list" aria-label="Your tasks"></ul>
      <p class="empty-state" id="empty-state">All clear. Add a task to get started.</p>

      <form class="add-area" id="add-form">
        <label for="task-input" hidden>Add a task</label>
        <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="Add a task..." autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Add task
        </button>
      </form>
    </section>

    <p class="storage-note" id="storage-note" role="status" aria-live="polite">Your list is saved on this device.</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "little-list.tasks.v1";
      const examples = [
        { id: "example-1", text: "Take a quiet moment for coffee", completed: true },
        { id: "example-2", text: "Reply to the messages I’ve been meaning to", completed: false },
        { id: "example-3", text: "Step outside for a little fresh air", completed: false }
      ];

      const list = document.querySelector("#task-list");
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const emptyState = document.querySelector("#empty-state");
      const remainingLabel = document.querySelector("#remaining-label");
      const progressLabel = document.querySelector("#progress-label");
      const progressFill = document.querySelector("#progress-fill");
      const progressbar = document.querySelector("#progressbar");
      const storageNote = document.querySelector("#storage-note");
      let tasks = [];

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short", month: "short", day: "numeric"
      }).format(new Date());
      document.querySelector("#today").dateTime = new Date().toISOString().slice(0, 10);

      function showStorageError(message) {
        storageNote.textContent = message;
        storageNote.classList.add("error");
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          storageNote.textContent = "Your list is saved on this device.";
          storageNote.classList.remove("error");
        } catch {
          showStorageError("Could not save changes to this device. Your list is still available for now.");
        }
      }

      function readTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved === null) {
            tasks = examples.map(task => ({ ...task }));
            saveTasks();
            return;
          }
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || !parsed.every(task =>
            task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
          )) {
            throw new Error("Saved task data has an invalid format.");
          }
          tasks = parsed;
        } catch (error) {
          tasks = examples.map(task => ({ ...task }));
          showStorageError("Saved tasks could not be read. Showing the example list instead.");
          if (error instanceof DOMException && error.name === "SecurityError") {
            showStorageError("Storage is unavailable in this browser. Your list may not be saved.");
          }
        }
      }

      function makeTask(task, index) {
        const row = document.createElement("li");
        row.className = `task${task.completed ? " is-complete" : ""}`;
        row.style.animationDelay = `${Math.min(index, 6) * 35}ms`;

        const checkWrap = document.createElement("span");
        checkWrap.className = "check-wrap";

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.text}`);
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const checkUi = document.createElement("span");
        checkUi.className = "check-ui";
        checkUi.setAttribute("aria-hidden", "true");
        checkUi.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        checkWrap.append(checkbox, checkUi);

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "delete-task";
        remove.type = "button";
        remove.setAttribute("aria-label", `Delete: ${task.text}`);
        remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 9.2a1 1 0 0 1-1 .9H7.1a1 1 0 0 1-1-.9L5.5 6m2.8 2.2v5m3.4-5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        row.append(checkWrap, text, remove);
        return row;
      }

      function render() {
        list.replaceChildren(...tasks.map(makeTask));
        emptyState.classList.toggle("visible", tasks.length === 0);
        const completed = tasks.filter(task => task.completed).length;
        const remaining = tasks.length - completed;
        const percent = tasks.length === 0 ? 0 : Math.round(completed / tasks.length * 100);
        remainingLabel.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        progressLabel.textContent = `${percent}% done`;
        progressFill.style.width = `${percent}%`;
        progressbar.setAttribute("aria-valuenow", String(percent));
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.push({ id: crypto.randomUUID(), text, completed: false });
        saveTasks();
        render();
        form.reset();
        input.focus();
      });

      readTasks();
      render();
    })();
  </script>
</body>
</html>
